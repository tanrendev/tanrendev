<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 200" width="830" height="200" role="img" aria-labelledby="t d">
  <title id="t">Now spinning: Locked Away by Gabzito</title>
  <desc id="d">Turntable card: the most played track of the last four weeks.</desc>
  <style>
    .label { transform-origin: 106px 100px; animation: spin 8s linear infinite; }
    .sheen { transform-origin: 106px 100px; animation: sway 7s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sway { 50% { transform: rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { .label, .sheen { animation: none; } }
  </style>
